spring.application.name=member-management

#PostgreSQL Database
spring.datasource.url=jdbc:postgresql://localhost:5432/member
spring.datasource.username=postgres
spring.datasource.password=01012020

#Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

#Connection Pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000

#JWT
app.jwt-expiration-milliseconds=3600000
app.jwt-secret=MySuperSecretKey123456789012345strongenough

#Redis
spring.cache.type= redis
spring.data.redis.host= localhost
spring.data.redis.port= 6379
spring.data.redis.password=
spring.data.redis.timeout= 30000
spring.data.redis.time-to-live= 2200000

#Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Log
logging.level.root=INFO
logging.level.org.springframework.web=DEBUG
logging.level.com.surest=DEBUG
logging.file.name=logs/application.log
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

#Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html