spring.application.name=member-management

spring.datasource.url=jdbc:postgresql://localhost:5432/testdb
spring.datasource.username=testuser
spring.datasource.password=

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

app.jwt-expiration-milliseconds=3600000
app.jwt-secret=MySuperSecretKey123456789012345strongenough

spring.flyway.enabled=false

spring.cache.type= none
spring.data.redis.host= localhost
spring.data.redis.port= 6379
spring.data.redis.password=
spring.data.redis.timeout= 30000
spring.data.redis.time-to-live= 2200000

